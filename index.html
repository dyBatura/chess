<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Empty Chessboard Grid</title>
  <link rel="stylesheet" href="style.css">  
</head>
<body>
  <!-- Home Page Overlay -->
  <div id="home-page" class="overlay">
    <div class="menu-content">
      <h1>Chess Multiplayer</h1>
      <div class="menu-buttons">
        <button id="play-btn" class="menu-btn">Play</button>
        <button id="settings-btn" class="menu-btn secondary">Settings</button>
      </div>
    </div>
  </div>

  <!-- Blank Settings Menu Overlay with Top-Right Cross -->
  <div id="settings-menu" class="overlay hidden">
    <div class="menu-content">
      <span id="close-settings-btn" class="close-cross">&times;</span>
      <h2>Settings</h2>
      <div style="height: 120px;"></div> <!-- Blank menu space -->
    </div>
  </div>
  <!-- Real-time lobby pause menu overlay with Top-Right Cross -->
  <div id="pause-menu" class="overlay">
    <div class="menu-content">
      <span id="close-menu-btn" class="close-cross">&times;</span>
      <h2>Waiting for Opponent</h2>
      <p>The game will start automatically when the second player connects.</p>
      <div class="spinner"></div>
      
      <!-- Bottom button layout with only the Reload button remaining -->
      <div class="menu-buttons">
        <button id="reload-btn" class="menu-btn">Reload Page</button>
      </div>
    </div>
  </div>
  <div class="turn-indicator">
    You are: <span id="player-color-text">Connecting...</span> |
    Turn: <span id="turn-text">White</span> 
    | White Score: <span id="white-score">0</span> 
    | Black Score: <span id="black-score">0</span>
  </div>
  <div class="game-container">
    <div id="chessboard"></div>
    
    <div class="history-panel">
      <h3>Move History</h3>
      <div id="moves-list"></div>
    </div>
  </div>

  <script>
    class EmptyChessBoard {
      constructor(containerId) {
        this.container = document.getElementById(containerId);
        this.squares = [];
        this.playerColorTextEl = document.getElementById('player-color-text');
        this.pauseMenuEl = document.getElementById('pause-menu');
        this.menuTitleEl = this.pauseMenuEl.querySelector('.menu-content h2');
        this.menuTextEl = this.pauseMenuEl.querySelector('.menu-content p');

        // Set initial connecting texts (keep these here too)
        this.menuTitleEl.textContent = "Connecting to Server";
        this.menuTextEl.textContent = "Please wait while your browser establishes a secure connection to the multiplayer server.";
        
        // Unified Unicode dictionary for both colors
        // High-resolution SVG pieces hosted on Wikimedia Commons
        this.piecesSVGs = {
          'wp': 'https://upload.wikimedia.org/wikipedia/commons/4/45/Chess_plt45.svg',
          'wn': 'https://upload.wikimedia.org/wikipedia/commons/7/70/Chess_nlt45.svg',
          'wb': 'https://upload.wikimedia.org/wikipedia/commons/b/b1/Chess_blt45.svg',
          'wr': 'https://upload.wikimedia.org/wikipedia/commons/7/72/Chess_rlt45.svg',
          'wq': 'https://upload.wikimedia.org/wikipedia/commons/1/15/Chess_qlt45.svg',
          'wk': 'https://upload.wikimedia.org/wikipedia/commons/4/42/Chess_klt45.svg',
          'bp': 'https://upload.wikimedia.org/wikipedia/commons/c/c7/Chess_pdt45.svg',
          'bn': 'https://upload.wikimedia.org/wikipedia/commons/e/ef/Chess_ndt45.svg',
          'bb': 'https://upload.wikimedia.org/wikipedia/commons/9/98/Chess_bdt45.svg',
          'br': 'https://upload.wikimedia.org/wikipedia/commons/f/ff/Chess_rdt45.svg',
          'bq': 'https://upload.wikimedia.org/wikipedia/commons/4/47/Chess_qdt45.svg',
          'bk': 'https://upload.wikimedia.org/wikipedia/commons/f/f0/Chess_kdt45.svg'
        };

        // Full board state configuration
        this.boardState = [
          ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'],
          ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'],
          ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']
        ];

        this.createBoard();
        this.renderPieces();
        this.selectedSquare = null;
        this.turn = 'w'; // 'w' for white, 'b' for black
        this.turnTextEl = document.getElementById('turn-text');
        // Score tracking state
        this.whiteScore = 0;
        this.blackScore = 0;
        this.whiteScoreEl = document.getElementById('white-score');
        this.blackScoreEl = document.getElementById('black-score');

        // Chess piece evaluation points
        this.pieceValues = {
          'p': 1,
          'n': 3,
          'b': 3,
          'r': 5,
          'q': 9,
          'k': 0 // King cannot be legally captured
        };
        this.gameOver = false;
        this.enPassantSquare = null; // Stores { row, col } of the active en passant target square
        // Add to the bottom of constructor()
        this.hasMoved = {
          'w_k': false, 'w_r_left': false, 'w_r_right': false,
          'b_k': false, 'b_r_left': false, 'b_r_right': false
        };
        this.historyCount = 0;
        this.currentMoveRow = null;
        this.isRemoteMove = false; // Flag to prevent move feedback loops
        this.playerColor = null;   // Assigned 'w' or 'b' by the server
        
        document.getElementById('reload-btn').addEventListener('click', () => {
          window.location.reload();
        });

        document.getElementById('close-menu-btn').addEventListener('click', () => {
          this.pauseMenuEl.classList.add('hidden');
        });
        // Map the new Home Page and Settings elements
        this.homePageEl = document.getElementById('home-page');
        this.settingsMenuEl = document.getElementById('settings-menu');

        // Home Page: Play Button handler (Triggers routing to the game page)
        document.getElementById('play-btn').addEventListener('click', () => {
          window.location.hash = '#/game';
        });

        // Home Page: Settings Button handler
        document.getElementById('settings-btn').addEventListener('click', () => {
          this.settingsMenuEl.classList.remove('hidden');
        });

        // Settings Menu: Close Button handler
        document.getElementById('close-settings-btn').addEventListener('click', () => {
          this.settingsMenuEl.classList.add('hidden');
        });

        // Initialize the router on load and listen for URL changes
        window.addEventListener('hashchange', () => this.handleRouting());
        this.handleRouting(); // Run immediately on page load
      }

      clearPossibleMoves() {
        const dots = this.container.querySelectorAll('.possible-move-dot');
        dots.forEach(dot => dot.remove());
      }

      showPossibleMoves(from) {
        this.clearPossibleMoves();
        const movingPiece = this.boardState[from.row][from.col];
        const pieceType = movingPiece[1];
        const color = movingPiece[0];

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const to = { row, col };
            const targetPiece = this.boardState[row][col];

            if (targetPiece && targetPiece[0] === color) continue;
            if (from.row === row && from.col === col) continue;

            let isValid = false;
            if (pieceType === 'r') isValid = this.isValidRookMove(from, to);
            else if (pieceType === 'b') isValid = this.isValidBishopMove(from, to);
            else if (pieceType === 'q') isValid = this.isValidQueenMove(from, to);
            else if (pieceType === 'n') isValid = this.isValidKnightMove(from, to);
            else if (pieceType === 'p') isValid = this.isValidPawnMove(from, to, color);
            else if (pieceType === 'k') isValid = this.isValidKingMove(from, to, color);

            if (!isValid) continue;

            // Simulate turn check
            const originalTarget = this.boardState[row][col];
            this.boardState[row][col] = movingPiece;
            this.boardState[from.row][from.col] = null;
            const leavesKingInCheck = this.isKingInCheck(color);
            this.boardState[from.row][from.col] = movingPiece;
            this.boardState[row][col] = originalTarget;

            if (leavesKingInCheck) continue;

            const dot = document.createElement('div');
            dot.classList.add('possible-move-dot');
            this.squares[row][col].appendChild(dot);
          }
        }
      }

      createBoard() {
        this.container.innerHTML = '';
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];

        for (let row = 0; row < 8; row++) {
          this.squares[row] = [];
          
          for (let col = 0; col < 8; col++) {
            const square = document.createElement('div');
            square.classList.add('square');

            // Add boundary tracking classes for CSS coordinate management
            square.classList.add(`row-${row}`);
            square.classList.add(`col-${col}`);

            // Set alternating colors
            const isLight = (row + col) % 2 === 0;
            square.classList.add(isLight ? 'light' : 'dark');

            // Store coordinate indices in data attributes
            square.dataset.row = row;
            square.dataset.col = col;

            // Add Rank numbers (8-1) to leftmost (col-0) and rightmost (col-7) columns
            if (col === 0 || col === 7) {
              const rankLabel = document.createElement('span');
              rankLabel.classList.add('coordinate', 'rank');
              rankLabel.textContent = 8 - row;
              square.appendChild(rankLabel);
            }

            // Add File letters (a-h) to top (row-0) and bottom (row-7) rows
            if (row === 0 || row === 7) {
              const fileLabel = document.createElement('span');
              fileLabel.classList.add('coordinate', 'file');
              fileLabel.textContent = files[col];
              square.appendChild(fileLabel);
            }

            // Simple click listener
            square.addEventListener('click', () => this.handleSquareClick(row, col));

            this.container.appendChild(square);
            this.squares[row][col] = square;
          }
        }
      }

      resetGame() {
        this.boardState = [
          ['br', 'bn', 'bb', 'bq', 'bk', 'bb', 'bn', 'br'],
          ['bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp', 'bp'],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          [null, null, null, null, null, null, null, null],
          ['wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp', 'wp'],
          ['wr', 'wn', 'wb', 'wq', 'wk', 'wb', 'wn', 'wr']
        ];
        this.turn = 'w';
        this.gameOver = false;
        this.whiteScore = 0;
        this.blackScore = 0;
        this.whiteScoreEl.textContent = '0';
        this.blackScoreEl.textContent = '0';
        this.enPassantSquare = null;
        this.selectedSquare = null;
        
        // Reset castling trackers
        this.hasMoved = {
          'w_k': false, 'w_r_left': false, 'w_r_right': false,
          'b_k': false, 'b_r_left': false, 'b_r_right': false
        };
        
        // Clear move history
        document.getElementById('moves-list').innerHTML = '';
        this.historyCount = 0;
        this.currentMoveRow = null;

        this.clearPossibleMoves();
        this.renderPieces();
      }

      connectToServer() {
        // Connect to the WebSocket backend 
        //this.socket = new WebSocket('ws://localhost:8080');
        this.socket = new WebSocket('wss://chess-d7rf.onrender.com');

        // Triggered when your browser successfully establishes a connection with the backend
        this.socket.onopen = () => {
          this.menuTitleEl.textContent = "Waiting for Opponent";
          this.menuTextEl.textContent = "The game will start automatically when the second player connects.";
        };

        // Triggered if your connection to the server is lost or fails to open
        this.socket.onclose = () => {
          this.pauseMenuEl.classList.remove('hidden');
          this.menuTitleEl.textContent = "Disconnected from Server";
          this.menuTextEl.textContent = "Connection lost. Please click 'Reload Page' to attempt reconnection.";
        };

        this.socket.onmessage = (event) => {
          const data = JSON.parse(event.data);
          
          if (data.type === 'init') {
            this.playerColor = data.color;
            this.playerColorTextEl.textContent = this.playerColor === 'w' ? 'White' : 'Black';
            
            // Rotate the board layout if the server assigned you Black
            if (this.playerColor === 'b') {
              this.container.classList.add('flipped');
            }
          } else if (data.type === 'start') {
            // Restore the close menu button and hide the overlay when both players are connected
            document.getElementById('close-menu-btn').classList.remove('hidden');
            this.pauseMenuEl.classList.add('hidden');
          } else if (data.type === 'pause') {
            // Reset the board state silently in JS instead of reloading the page to prevent network feedback loops
            this.resetGame();
            
            // Show the waiting menu overlay and block gameplay
            this.pauseMenuEl.classList.remove('hidden');
            document.getElementById('close-menu-btn').classList.add('hidden');
            
            this.menuTitleEl.textContent = "Opponent Disconnected";
            this.menuTextEl.textContent = "Your opponent left or reloaded the game. Waiting for a new player to connect...";
  
          } else if (data.from && data.to) {
            // Apply opponent's remote move by simulating clicks
            this.isRemoteMove = true;
            this.handleSquareClick(data.from.row, data.from.col);
            this.handleSquareClick(data.to.row, data.to.col);
            this.isRemoteMove = false;
          }
        };
      }

      handleRouting() {
        const hash = window.location.hash;

        if (hash === '#/game') {
          // Navigate to the Game Page
          this.homePageEl.classList.add('hidden');
          this.settingsMenuEl.classList.add('hidden');
          
          // Only connect if we aren't already connected
          if (!this.socket || this.socket.readyState !== WebSocket.OPEN) {
            this.pauseMenuEl.classList.remove('hidden');
            this.connectToServer();
          }
        } else {
          // Default to the Home Page (/#/home or root)
          window.location.hash = '#/home';
          this.homePageEl.classList.remove('hidden');
          this.settingsMenuEl.classList.add('hidden');
          this.pauseMenuEl.classList.add('hidden');
          
          // Safely disconnect from the server if they navigate back to the home page
          if (this.socket) {
            this.socket.close();
            this.socket = null;
          }
        }
      }

      renderPieces() {
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const pieceCode = this.boardState[row][col];
            const square = this.squares[row][col];
            
            const existingPieces = square.querySelectorAll('.piece');
            existingPieces.forEach(p => p.remove());

            if (pieceCode) {
              const pieceColor = pieceCode[0];
              const pieceEl = document.createElement('div');
              
              pieceEl.classList.add('piece');
              pieceEl.classList.add(pieceColor === 'w' ? 'white-piece' : 'black-piece');
              
              // Apply the vector piece image with high-performance CSS styling
              pieceEl.style.backgroundImage = `url(${this.piecesSVGs[pieceCode]})`;
              pieceEl.style.backgroundSize = 'contain';
              pieceEl.style.backgroundRepeat = 'no-repeat';
              pieceEl.style.backgroundPosition = 'center';
              pieceEl.style.width = '84%';  // Scales piece beautifully inside the square boundaries
              pieceEl.style.height = '84%';
              
              square.appendChild(pieceEl);
            }
          }
        }
      }
      
      isValidRookMove(from, to) {
        // Rooks can only move along the same row or the same column
        if (from.row !== to.row && from.col !== to.col) {
          return false;
        }

        // Determine direction step values: -1, 0, or 1
        const rowStep = from.row === to.row ? 0 : (to.row > from.row ? 1 : -1);
        const colStep = from.col === to.col ? 0 : (to.col > from.col ? 1 : -1);

        let currentRow = from.row + rowStep;
        let currentCol = from.col + colStep;

        // Check all squares between the source and target for obstacles
        while (currentRow !== to.row || currentCol !== to.col) {
          if (this.boardState[currentRow][currentCol] !== null) {
            return false; // Path is blocked
          }
          currentRow += rowStep;
          currentCol += colStep;
        }

        return true;
      }

      isValidBishopMove(from, to) {
        const rowDiff = Math.abs(from.row - to.row);
        const colDiff = Math.abs(from.col - to.col);

        // Bishops must move diagonally
        if (rowDiff !== colDiff) {
          return false;
        }

        // Determine direction step values: -1 or 1
        const rowStep = to.row > from.row ? 1 : -1;
        const colStep = to.col > from.col ? 1 : -1;

        let currentRow = from.row + rowStep;
        let currentCol = from.col + colStep;

        // Check all squares along the diagonal for obstacles
        while (currentRow !== to.row || currentCol !== to.col) {
          if (this.boardState[currentRow][currentCol] !== null) {
            return false; // Path is blocked
          }
          currentRow += rowStep;
          currentCol += colStep;
        }

        return true;
      }

      isValidQueenMove(from, to) {
        return this.isValidRookMove(from, to) || this.isValidBishopMove(from, to);
      }

      isValidKnightMove(from, to) {
        const rowDiff = Math.abs(from.row - to.row);
        const colDiff = Math.abs(from.col - to.col);

        return (rowDiff === 2 && colDiff === 1) || (rowDiff === 1 && colDiff === 2);
      }

      isValidPawnMove(from, to, color) {
        const rowDiff = to.row - from.row;
        const colDiff = Math.abs(to.col - from.col);
        const targetPiece = this.boardState[to.row][to.col];

        // Check if target is the active en passant square
        const isEnPassant = this.enPassantSquare && 
                            to.row === this.enPassantSquare.row && 
                            to.col === this.enPassantSquare.col;

        if (color === 'w') {
          if (rowDiff === -1 && colDiff === 0 && !targetPiece) {
            return true;
          }
          if (from.row === 6 && rowDiff === -2 && colDiff === 0 && !targetPiece) {
            if (this.boardState[5][from.col] === null) {
              return true;
            }
          }
          // Allow diagonal movement if there is a target piece OR if it is an En Passant capture
          if (rowDiff === -1 && colDiff === 1 && (targetPiece || isEnPassant)) {
            return true;
          }
        } else if (color === 'b') {
          if (rowDiff === 1 && colDiff === 0 && !targetPiece) {
            return true;
          }
          if (from.row === 1 && rowDiff === 2 && colDiff === 0 && !targetPiece) {
            if (this.boardState[2][from.col] === null) {
              return true;
            }
          }
          // Allow diagonal movement if there is a target piece OR if it is an En Passant capture
          if (rowDiff === 1 && colDiff === 1 && (targetPiece || isEnPassant)) {
            return true;
          }
        }

        return false;
      }

      isValidKingMove(from, to, color) {
        const rowDiff = Math.abs(from.row - to.row);
        const colDiff = Math.abs(from.col - to.col);

        // Standard 1-square movement validation
        if (rowDiff <= 1 && colDiff <= 1) {
          return true; // Step safety check is removed
        }

        // Castling movement validation
        if (rowDiff === 0 && colDiff === 2) {
          return this.isValidCastling(from, to, color);
        }

        return false;
      }

      isValidCastling(from, to, color) {
        if (this.hasMoved[color + '_k']) return false;

        const row = color === 'w' ? 7 : 0;
        const opponentColor = color === 'w' ? 'b' : 'w';

        // 1. Kingside (Short Castling)
        if (to.row === row && to.col === 6) {
          if (this.hasMoved[color + '_r_right']) return false;
          if (this.boardState[row][5] !== null || this.boardState[row][6] !== null) return false;
          
          // Safety checks: King must not be in check, pass through check, or land in check
          if (this.isSquareUnderAttack({ row, col: 4 }, opponentColor)) return false;
          if (this.isSquareUnderAttack({ row, col: 5 }, opponentColor)) return false;
          if (this.isSquareUnderAttack({ row, col: 6 }, opponentColor)) return false;
          
          return true;
        }

        // 2. Queenside (Long Castling)
        if (to.row === row && to.col === 2) {
          if (this.hasMoved[color + '_r_left']) return false;
          if (this.boardState[row][1] !== null || this.boardState[row][2] !== null || this.boardState[row][3] !== null) return false;
          
          // Safety checks: King must not be in check, pass through check, or land in check
          if (this.isSquareUnderAttack({ row, col: 4 }, opponentColor)) return false;
          if (this.isSquareUnderAttack({ row, col: 3 }, opponentColor)) return false;
          if (this.isSquareUnderAttack({ row, col: 2 }, opponentColor)) return false;
          
          return true;
        }

        return false;
      }

      findKing(color) {
        const kingCode = color + 'k';
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            if (this.boardState[row][col] === kingCode) {
              return { row, col };
            }
          }
        }
        return null;
      }

      isSquareUnderAttack(target, attackerColor) {
        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const piece = this.boardState[row][col];
            if (piece && piece[0] === attackerColor) {
              const pieceType = piece[1];
              const from = { row, col };

              if (pieceType === 'r' && this.isValidRookMove(from, target)) return true;
              if (pieceType === 'b' && this.isValidBishopMove(from, target)) return true;
              if (pieceType === 'q' && this.isValidQueenMove(from, target)) return true;
              if (pieceType === 'n' && this.isValidKnightMove(from, target)) return true;
              if (pieceType === 'p' && this.isValidPawnMove(from, target, attackerColor)) return true;
            }
          }
        }
        return false;
      }

      isKingInCheck(color) {
        const kingPos = this.findKing(color);
        if (!kingPos) return false;
        const attackerColor = color === 'w' ? 'b' : 'w';
        return this.isSquareUnderAttack(kingPos, attackerColor);
      }

      addMoveToHistory(from, to, pieceCode) {
        const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
        const ranks = [8, 7, 6, 5, 4, 3, 2, 1];
        
        let moveLabel = '';

        // Check if the move is castling (King moving 2 squares horizontally)
        if (pieceCode[1] === 'k' && Math.abs(from.col - to.col) === 2) {
          moveLabel = to.col === 6 ? '0-0' : '0-0-0';
        } else {
          // Standard move notation
          const fromNotation = files[from.col] + ranks[from.row];
          const toNotation = files[to.col] + ranks[to.row];
          const pieceLetter = pieceCode[1] === 'p' ? '' : pieceCode[1].toUpperCase();
          moveLabel = pieceLetter + fromNotation + '→' + toNotation;
        }
        
        const movesListEl = document.getElementById('moves-list');
        const color = pieceCode[0]; // 'w' or 'b'
        
        if (color === 'w') {
          // Generate new step row for the White/Black turn pair
          const moveRow = document.createElement('div');
          moveRow.classList.add('move-row');
          
          const moveIndex = Math.floor(this.historyCount / 2) + 1;
          moveRow.innerHTML = `<span class="move-num">${moveIndex}.</span><span class="white-move">${moveLabel}</span><span class="black-move"></span>`;
          movesListEl.appendChild(moveRow);
          this.currentMoveRow = moveRow;
        } else {
          // Fill the Black cell in the current move row
          if (this.currentMoveRow) {
            this.currentMoveRow.querySelector('.black-move').textContent = moveLabel;
          }
        }
        
        this.historyCount++;
        // Keep scrolling panel down as moves increase
        movesListEl.scrollTop = movesListEl.scrollHeight;
      }
    
      hasAnyLegalMoves(color) {
        for (let r = 0; r < 8; r++) {
          for (let c = 0; c < 8; c++) {
            const piece = this.boardState[r][c];
            if (piece && piece[0] === color) {
              const from = { row: r, col: c };
              const pieceType = piece[1];

              for (let tr = 0; tr < 8; tr++) {
                for (let tc = 0; tc < 8; tc++) {
                  const to = { row: tr, col: tc };
                  const targetPiece = this.boardState[tr][tc];

                  if (targetPiece && targetPiece[0] === color) continue;
                  if (r === tr && c === tc) continue;

                  let isValid = false;
                  if (pieceType === 'r') isValid = this.isValidRookMove(from, to);
                  else if (pieceType === 'b') isValid = this.isValidBishopMove(from, to);
                  else if (pieceType === 'q') isValid = this.isValidQueenMove(from, to);
                  else if (pieceType === 'n') isValid = this.isValidKnightMove(from, to);
                  else if (pieceType === 'p') isValid = this.isValidPawnMove(from, to, color);
                  else if (pieceType === 'k') isValid = this.isValidKingMove(from, to, color);

                  if (!isValid) continue;

                  // Simulate the move to verify if it successfully resolves check
                  const originalTarget = this.boardState[tr][tc];
                  this.boardState[tr][tc] = piece;
                  this.boardState[r][c] = null;
                  const leavesKingInCheck = this.isKingInCheck(color);
                  this.boardState[r][c] = piece;
                  this.boardState[tr][tc] = originalTarget;

                  if (!leavesKingInCheck) {
                    return true; // Found at least one legal escape path!
                  }
                }
              }
            }
          }
        }
        return false; // No legal escape paths found (Checkmate)
      }

    }
  </script>
